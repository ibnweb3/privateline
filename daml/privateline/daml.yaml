sdk-version: 3.4.11
name: privateline-v0
version: 0.2.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
# The version already on LocalNet. The build checks that this one is a valid smart-contract
# upgrade of it, so existing accounts keep working after the new DAR is distributed.
upgrades: ../dars/privateline-v0-0.1.0.dar
build-options:
  - --target=2.2
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
