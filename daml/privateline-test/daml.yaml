sdk-version: 3.4.11
name: privateline-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../privateline/.daml/dist/privateline-v0-0.3.0.dar
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/governance-core-v1-0.1.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
build-options:
  - --target=2.2
  - -Wno-upgrade-interfaces
  - -Wno-template-interface-depends-on-daml-script
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
